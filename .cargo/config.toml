# Per-worktree cargo target dir.
# All worktrees share the XvisionCargoTarget volume, but they MUST NOT
# share one target dir: identical package versions with different sources
# (e.g. protocol.rs gaining a field on another branch) make cargo reuse
# stale artifacts and fail with ghost E0063 "missing field" errors.
[build]
target-dir = "/Volumes/XvisionCargoTarget/target/wt-dropdown-audit-strategy-search"
